name: Layout

# Manual-only until the Actions budget policy for private repos settles
# (0 private minutes until the December reset); then wire pull_request/push.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  layout:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: python3 tools/check_repo_layout.py
